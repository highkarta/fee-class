<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Verse | Login Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <p id="logo">code verse</p>
      <div class="links">
        <a href="#" class="link">Home</a>
        <a href="#" class="link">About</a>
        <a href="#" class="link">Contact</a>
      </div>
      <div class="notification">
        <p>🔔</p>
        <div class="num-notify">
          <p>5</p>
        </div>
      </div>
    </nav>
    <div id="main">
      <div class="login">
        <div id="close">
          <p>&times;</p>
        </div>
        <div class="text">
          <h1>Welcome Back</h1>
          <h3>login</h3>
        </div>
        <form action="" method="">
          <input type="email" name="" id="email" placeholder="abc@email.com" />
          <div id="pass">
            <input type="password" name="" id="password" placeholder="password" minlength="8"/>
            <div class="pass-info" title="Add a password of length at least 8">
              <p>❔</p>
            </div>
          </div>
          <button id="btn"><a href="meme.html">Login</a></button>
          <!-- <input type="submit" value="Login" id="btn" /> -->
        </form>
        <div class="actions">
          <a href="#">forgot password?</a>
          <p>Don't have an account? <a href="meme.html">Sign up</a></p>
        </div>
      </div>
      <div class="chat">
        <p>💬</p>
      </div>
    </div>
    <div class="circ circ1"></div>
    <div class="circ circ2"></div>
  </body>
</html>

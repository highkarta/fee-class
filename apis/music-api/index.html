<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>🎸 Artist & Discography Explorer</h1>
    
    <div class="search-box">
      <input type="text" id="artistInput" placeholder="Enter artist name (eg: Metallica)" />
      <button id="searchBtn">Search</button>
    </div>

    <div id="loading" class="hidden">Searching MusicBrainz database...</div>
    <div id="results"></div>
  </main>
</body>
</html>
